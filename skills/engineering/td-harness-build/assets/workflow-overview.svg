<rect x="350" y="305" width="620" height="55" rx="9" fill="#fff7ed" stroke="#e5a35c"/><text x="660" y="328" text-anchor="middle">用户确认整体方案，授权指定 Task</text><text x="660" y="350" class="small" text-anchor="middle">范围、模块职责、接口、任务依赖与验收方式</text>
