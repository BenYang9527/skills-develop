<text x="460.0" y="168.0" class="" text-anchor="middle">Full workflow</text>
<rect x="345" y="240" width="230" height="100" rx="9" class="node"/>
<text x="460.0" y="281.0" class="" text-anchor="middle">Task B</text>
<text x="460.0" y="313.0" class="" text-anchor="middle">Full workflow</text>
<rect x="915" y="95" width="230" height="100" rx="9" class="node"/>
<text x="1030.0" y="136.0" class="" text-anchor="middle">Task C</text>
<text x="1030.0" y="168.0" class="" text-anchor="middle">Full workflow</text>
