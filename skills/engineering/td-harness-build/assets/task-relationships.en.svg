<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Two levels of parallel work</title><desc id="desc">Only authorized tasks with ready dependencies may start. A and B can run in parallel. C waits for the required A result to merge into the integration branch. Inside a task, only Implement is parallelized; integrate before Verify, Docs, Review and Submit.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#203b5b;font-size:21px}.heading{font-size:23px;font-weight:600}.small{font-size:17px;fill:#536f8f}.node{fill:#eff6ff;stroke:#8aacd3;stroke-width:1.5}.line{fill:none;stroke:#6886a7;stroke-width:1.7;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#6886a7" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="780" fill="white"/>
<rect x="16" y="16" width="1168" height="354" rx="14" fill="#f8fafc" stroke="#d9e3ef"/>
<rect x="16" y="390" width="1168" height="318" rx="14" fill="#f8fafc" stroke="#d9e3ef"/>

<text x="40" y="55" class="heading" text-anchor="start">1 · Across tasks: A and B are independent; C depends on A</text>
<text x="40" y="432" class="heading" text-anchor="start">2 · Within a task: parallel Implement blocks, then one shared workflow</text>
