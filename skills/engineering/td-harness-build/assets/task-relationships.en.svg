<text x="745" y="107" class="small" text-anchor="middle">Required result merged</text>
<text x="745" y="130" class="small" text-anchor="middle">into integration branch</text>
<rect x="45" y="525" width="225" height="90" rx="9" class="node"/>
<text x="157.5" y="577.0" class="" text-anchor="middle">Clarify → Plan</text>
<rect x="345" y="465" width="205" height="85" rx="9" class="node"/>
<text x="447.5" y="498.5" class="" text-anchor="middle">Implement</text>
<text x="447.5" y="530.5" class="" text-anchor="middle">Block 1</text>
<rect x="345" y="600" width="205" height="85" rx="9" class="node"/>
<text x="447.5" y="633.5" class="" text-anchor="middle">Implement</text>
<text x="447.5" y="665.5" class="" text-anchor="middle">Block 2</text>
